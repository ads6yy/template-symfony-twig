# Two-factor authentication
two_factor:
  enable:
    title: Enable two-factor authentication
    step_scan: '1. Scan this QR code with an authenticator app (Google Authenticator, Authy, ...).'
    qr_code_alt: QR code for your authenticator app
    manual_entry: 'Cannot scan the code? Enter this key manually:'
    step_confirm: '2. Enter the 6-digit code displayed by the app to confirm the setup.'
    code: Authentication code
    invalid_code: The code is invalid. Please try again with the current code from your app.
    submit: Enable
    cancel: Cancel
  backup_codes:
    title: Your backup codes
    warning: 'Save these codes somewhere safe. Each code can be used once to log in if you lose access to your authenticator app. They will not be shown again.'
    download: Download codes
    done: I have saved my codes

# Flash Messages
flash:
  user:
    created: User created successfully!
    updated: User updated successfully!
    deleted: User deleted successfully!
    invalid_csrf: Invalid CSRF token.
    status_updated: User status updated.
    password_changed: Password successfully changed!
    transition_not_allowed: 'The requested status transition is not allowed for this user.'
  auth:
    email_in_use: This email is already in use.
    registration_success: Registration successful! You can now log in.
    verify_email_sent: 'If an account matches, a verification email has been sent. Please check your inbox.'
    verify_email_success: Your email address has been verified. You can now log in.
    verify_email_error: 'The verification link is invalid or has expired. Please request a new one.'
    verify_email_already: This email address has already been verified.
    reset_success: Your password has been reset. You can now log in with your new password.
    reset_no_token: No reset password token found. Please request a new link.
    reset_invalid_token: 'The reset link is invalid or has expired. Please request a new one.'
  two_factor:
    enabled: Two-factor authentication is now enabled.
    already_enabled: Two-factor authentication is already enabled.
    disabled: Two-factor authentication has been disabled.
    reset: Two-factor authentication has been reset for this user.

# Error Messages
error:
  access_denied:
    view_profile: You can only view your own profile.
    edit_profile: You can only edit your own profile.
    change_password: You can only change your own password.
    two_factor: You can only manage two-factor authentication for your own account.

# Email Messages
email:
  user_created:
    subject: Welcome to our platform!
    title: Welcome!
    greeting: Hello %name%,
    message: Your account has been successfully created by an administrator. You can now log in to the platform with your email address.
    footer: If you have any questions, please contact your administrator.
  user_registered:
    subject: Welcome! Your registration is complete
    title: Registration Successful!
    greeting: Hello %name%,
    message: Thank you for registering on our platform! Your account has been successfully created and is now active.
    next_steps: You can now log in with your email address and start using all the features of our platform.
    footer: If you have any questions or need assistance, please don't hesitate to contact us.
  email_verification:
    subject: Please confirm your email address
    title: Confirm your email
    greeting: Hello %name%,
    message: Thank you for registering! Please confirm your email address by clicking the button below.
    button: Verify my email
    expiration: 'This link will expire in %duration%.'
    footer: If you did not create an account, you can safely ignore this email.
  reset_password:
    subject: Reset your password
    title: Password Reset Request
    greeting: Hello %name%,
    message: You requested to reset your password. Click the button below to choose a new one.
    button: Reset my password
    expiration: 'This link will expire in %duration%.'
    footer: If you did not request a password reset, you can safely ignore this email.

